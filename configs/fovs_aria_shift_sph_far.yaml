# Room-scale spherical attention-shift benchmark: as fovs_aria_shift_sph.yaml but an 8 m cube, so the scene cells reach
# 6.9 m (the paper's 3.2 m cube stops at ~1.6 m along each axis). Built for scripts/export_where_geometry.py (3D scene
# features for the lab's WHERE model); not comparable with the paper's grids for forecasting.
build:
  lift:
    cube_size: 8.0                     # room scale (distance bins to 6.9 m): for the WHERE 3D features
    resolution: 16
    orientation_deg: 55.0
    cone_deg: [30.0, 8.0, 2.0]
    sor_neighbors: 16
    sor_std_ratio: 2.0
    sor_scope: global
    max_dist_std: 0.1
    grid_frame: local
    crop_around_user: false
    grid: spherical                      # azimuth x elevation x distance cells (egospan/spherical.py)
  window: {steps_per_unit: 10, past_units: 2, future_units: 2, stride_units: 1, anchor: shift, shift_lag_steps: 3}
  pack:
    protocol: aea
    test_locations: [4]
    val_frac: 0.1
    seed: 0
    min_points_sigma: null
    cv_folds_by_location: true
data:
  root: data/fovs_aria_shift_sph_far
  levels: [orientation, peripheral, central, foveal]
  augment: true
  num_workers: 4
model:
  name: egospanlift
  f_maps: [128, 256, 512, 1024]
  layer_order: cbrd
train:
  epochs: 50
  batch_size: 16
  lr: 1.0e-4
  out_dir: runs/fovs_aria_shift_sph_far/scratch_s0
eval:
  space: native                          # cartesian: map back to 20 cm voxels (see spherical_ceiling.py)
