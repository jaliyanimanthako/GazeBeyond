# FoVS-Aria with the direction-adaptive spherical grid (our addition): the lab-matching rebuild settings of
# fovs_aria_lab_rebuild.yaml, but spans are binned into azimuth x elevation x distance cells (dense within 55 deg of
# head forward, medium at the sides, coarse behind; 40 x 24 x 8 cells) instead of 16^3 voxels. The same samples,
# split and CV folds as the lab data. Scored on the spherical cells themselves (eval.space: native); those
# IoUs are on a different scale from 20 cm voxel IoUs, so compare spherical runs only with each other.
build:
  lift:
    cube_size: 3.2
    resolution: 16
    orientation_deg: 55.0
    cone_deg: [30.0, 8.0, 2.0]
    sor_neighbors: 16
    sor_std_ratio: 2.0
    sor_scope: global
    max_dist_std: 0.1
    grid_frame: local
    crop_around_user: false
    grid: spherical                      # azimuth x elevation x distance cells (egospan/spherical.py)
  window: {steps_per_unit: 10, past_units: 2, future_units: 2, stride_units: 1}
  pack:
    protocol: aea
    test_locations: [4]
    val_frac: 0.1
    seed: 0
    min_points_sigma: null
    cv_folds_by_location: true
data:
  root: data/fovs_aria_sph
  levels: [orientation, peripheral, central, foveal]
  augment: true
  num_workers: 4
model:
  name: egospanlift
  f_maps: [128, 256, 512, 1024]
  layer_order: cbrd
train:
  epochs: 50
  batch_size: 16
  lr: 1.0e-4
  out_dir: runs/fovs_aria_sph/egospanlift_s0
eval:
  space: native                          # cartesian: map back to 20 cm voxels (see spherical_ceiling.py)
