# Same pipeline as fovs_aria.yaml on the fake AEA download, with a small model that trains on a laptop.
#   python scripts/build_dataset.py dummy-aea --out data/dummy_aea --n 15
#   python scripts/build_dataset.py aea  --config configs/dummy.yaml --src data/dummy_aea --out data/dummy_fovs
#   python scripts/build_dataset.py pack --config configs/dummy.yaml --out data/dummy_fovs
#   python scripts/train.py --config configs/dummy.yaml
build:
  lift: {cube_size: 3.2, resolution: 16, grid_frame: world}
  window: {steps_per_unit: 10, past_units: 2, future_units: 2, stride_units: 1}
  pack:
    protocol: aea
    test_locations: [4]
    min_points_sigma: null      # the tiny fake rooms have too few samples for the 2-sigma filter
data:
  root: data/dummy_fovs
  num_workers: 0
model:
  f_maps: [16, 32, 64, 128]
  layer_order: cgr
  tf_layers: 1
  tf_heads: 4
train:
  epochs: 10
  batch_size: 8
  lr: 1.0e-3
  device: cpu
  log_every: 0
  out_dir: runs/dummy
